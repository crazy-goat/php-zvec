name: Build & Test

on:
  pull_request:
    branches: [main]

env:
  ZVEC_VERSION: v0.7.0

jobs:
  ffi-linux:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            libc: glibc
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            libc: glibc
          - platform: linux-musl-x86_64
            runner: ubuntu-24.04
            libc: musl
          - platform: linux-musl-aarch64
            runner: ubuntu-24.04-arm
            libc: musl
    runs-on: ${{ matrix.runner }}
    name: ffi - ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Build FFI adapter
        run: .github/scripts/build-ffi-linux.sh ${{ matrix.libc }} "$ZVEC_VERSION"

      - name: Setup PHP
        if: matrix.libc == 'glibc'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ffi

      - name: Run tests
        if: matrix.libc == 'glibc'
        run: .github/scripts/run-tests.sh

      - name: DEBUG backtrace
        if: failure() && matrix.libc == 'glibc'
        run: |
          sudo apt-get install -y -qq gdb >/dev/null
          php -v; php -n -m; ldd $(which php); nproc; lscpu | head -20
          sed -n '/--FILE--/,/--EXPECT--/p' tests/test_collection_create.phpt | sed '1d;$d' > tests/dbg_cc.php
          gdb -batch -ex run -ex bt -ex 'info sharedlibrary' --args php -n -d extension=ffi tests/dbg_cc.php || true
          gdb -batch -ex run -ex bt --args php -n tests/dbg_cc.php || true

      - name: Run tests (Alpine)
        if: matrix.libc == 'musl'
        run: .github/scripts/test-ffi-musl.sh

  ffi-macos:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-14
    name: ffi - darwin-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ffi

      - name: Build FFI adapter
        run: ./build_zvec.sh "$ZVEC_VERSION"

      - name: Run tests
        run: .github/scripts/run-tests.sh

  ext:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php-version: ['8.4']

    name: ext - PHP ${{ matrix.php-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: phpize

      - name: Fetch zvec SDK
        run: ./fetch_zvec_sdk.sh "$ZVEC_VERSION"

      - name: Build PHP extension
        run: ./php-ext/build_ext.sh

      - name: Run tests
        env:
          ZVEC_EXT: ${{ github.workspace }}/php-ext/modules/zvec.so
        run: .github/scripts/run-tests.sh

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: zvec-php${{ matrix.php-version }}-ubuntu24-${{ runner.arch }}
          path: |
            php-ext/modules/zvec.so
            php-ext/modules/libzvec.so
