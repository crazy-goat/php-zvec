name: Build & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZVEC_VERSION: v0.7.0
  # Composer fetches dists from codeload.github.com, which rate-limits unauthenticated
  # requests. The automatic token needs no setup and raises the limit.
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  changes:
    name: Changes
    uses: crazy-goat/.github/.github/workflows/changes.yml@main
    with:
      # tests/test_docs_consistency.phpt reads README.md, CHANGELOG.md, MIGRATION.md and
      # AGENTS.md, so a change to them needs the test suite and is not docs-only.
      docs-regex: '^((CONTRIBUTING|SECURITY)\.md|docs/.*|LICENSE.*|\.github/ISSUE_TEMPLATE/.*|\.github/pull_request_template\.md|\.gitignore)$'

  docs:
    name: Docs
    uses: crazy-goat/.github/.github/workflows/docs-check.yml@main

  # Setup only; every check lives in bin/lint.sh (php-cs-fixer, PHPStan, Rector,
  # clang-format, shellcheck, hadolint).
  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Pinned: the versions the image ships would change under us without a commit here.
      - name: Install clang-format, shellcheck and hadolint
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          PIPX_BIN_DIR="$HOME/.local/bin" pipx install clang-format==23.1.2
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ --strip-components=1 -C "$HOME/.local/bin" shellcheck-v0.11.0/shellcheck
          curl -fsSL -o "$HOME/.local/bin/hadolint" https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x "$HOME/.local/bin/hadolint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/clang-format" --version
          "$HOME/.local/bin/shellcheck" --version
          "$HOME/.local/bin/hadolint" --version

      - name: Lint
        run: bin/lint.sh

  ffi-linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            libc: glibc
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            libc: glibc
          - platform: linux-musl-x86_64
            runner: ubuntu-24.04
            libc: musl
          - platform: linux-musl-aarch64
            runner: ubuntu-24.04-arm
            libc: musl
    runs-on: ${{ matrix.runner }}
    name: ffi - ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Build FFI adapter
        run: .github/scripts/build-ffi-linux.sh ${{ matrix.libc }} "$ZVEC_VERSION"

      - name: Setup PHP
        if: matrix.libc == 'glibc'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ffi

      - name: Run tests
        if: matrix.libc == 'glibc'
        run: .github/scripts/run-tests.sh

      - name: Run tests (Alpine)
        if: matrix.libc == 'musl'
        run: .github/scripts/test-ffi-musl.sh

  ffi-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    name: ffi - darwin-aarch64

    steps:
      - uses: actions/checkout@v7

      # setup-php hangs in Homebrew on macOS runners; Homebrew's php has FFI built in.
      - name: Install PHP
        run: brew install php && php -v && php -n -m | grep -x FFI

      - name: Build FFI adapter
        run: ./build_zvec.sh "$ZVEC_VERSION"

      - name: Run tests
        run: .github/scripts/run-tests.sh

  ext:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php-version: ['8.4']

    name: ext - PHP ${{ matrix.php-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: phpize

      - name: Fetch zvec SDK
        run: ./fetch_zvec_sdk.sh "$ZVEC_VERSION"

      - name: Build PHP extension
        run: ./php-ext/build_ext.sh

      - name: Run tests
        env:
          ZVEC_EXT: ${{ github.workspace }}/php-ext/modules/zvec.so
        run: .github/scripts/run-tests.sh

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: zvec-php${{ matrix.php-version }}-ubuntu24-${{ runner.arch }}
          path: |
            php-ext/modules/zvec.so
            php-ext/modules/libzvec.so

  ci-ok:
    name: ci-ok
    needs: [changes, docs, lint, ffi-linux, ffi-macos, ext]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Code changes: $CODE"
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) exit 1 ;; esac
          done
          # Documentation-only changes skip the heavy jobs; code changes need all of them.
          if [ "$CODE" = "true" ]; then
            for r in $RESULTS; do
              [ "$r" = "success" ] || exit 1
            done
          fi
