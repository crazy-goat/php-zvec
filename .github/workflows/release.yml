name: Release PHP Extension

on:
  push:
    tags:
      - 'v*'

env:
  ZVEC_VERSION: v0.7.0

jobs:
  create-release:
    runs-on: ubuntu-24.04
    name: Create Release

    permissions:
      contents: write

    steps:
      # Full history: the tag-on-main check below needs it, and the release notes are
      # read from CHANGELOG.md of the tagged commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main branch"
            exit 1
          fi

      # Merge the `## [X.Y.Z]` section of CHANGELOG.md before tagging.
      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { found = (index($0, "[" v "]") > 0 || index($0, "[v" v "]") > 0); next }
            /^\[[^]]+\]: / { found = 0 }
            found
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no non-empty section for ${version}"
            exit 1
          fi
          # GitHub rejects release notes over 125000 characters.
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import sys
          limit = 120000
          tag = sys.argv[1]
          text = open('release-notes.md', encoding='utf-8').read()
          if len(text) > limit:
              tail = ("\n\n_The notes were shortened because of the GitHub size limit. "
                      f"See [CHANGELOG.md](https://github.com/crazy-goat/php-zvec/blob/{tag}/CHANGELOG.md) "
                      "for the full text._\n")
              text = text[:limit - len(tail)]
              text = text[:text.rfind('\n')] + tail
              open('release-notes.md', 'w', encoding='utf-8').write(text)
              print(f"::warning::Release notes truncated to {len(text)} characters")
          PY

      # If the release already exists (created by hand), the build jobs only add assets.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            "${flags[@]}"

  release-ffi-linux:
    needs: create-release
    strategy:
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            libc: glibc
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            libc: glibc
          - platform: linux-musl-x86_64
            runner: ubuntu-24.04
            libc: musl
          - platform: linux-musl-aarch64
            runner: ubuntu-24.04-arm
            libc: musl
    runs-on: ${{ matrix.runner }}
    name: Build & Release FFI (${{ matrix.platform }})

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build FFI adapter
        run: .github/scripts/build-ffi-linux.sh ${{ matrix.libc }} "$ZVEC_VERSION"

      - name: Strip library
        run: strip -s ffi/build/libzvec_ffi.so

      - name: Setup PHP
        if: matrix.libc == 'glibc'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ffi

      - name: Run tests
        if: matrix.libc == 'glibc'
        run: .github/scripts/run-tests.sh

      - name: Run tests (Alpine)
        if: matrix.libc == 'musl'
        run: .github/scripts/test-ffi-musl.sh

      # Only our adapter is shipped; the Installer fetches libzvec from alibaba/zvec.
      - name: Package FFI library
        run: |
          ASSET_NAME="libzvec_ffi-${{ matrix.platform }}.tar.gz"
          tar -czf "$ASSET_NAME" -C ffi/build libzvec_ffi.so
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"

      - name: Upload FFI release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" "$ASSET_NAME" --clobber

  release-ffi-macos:
    needs: create-release
    runs-on: macos-15
    name: Build & Release FFI (darwin-aarch64)

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # setup-php hangs in Homebrew on macOS runners; Homebrew's php has FFI built in.
      - name: Install PHP
        run: brew install php && php -v && php -n -m | grep -x FFI

      - name: Build FFI adapter
        run: ./build_zvec.sh "$ZVEC_VERSION"

      - name: Strip library
        run: strip -S ffi/build/libzvec_ffi.dylib

      - name: Run tests
        run: .github/scripts/run-tests.sh

      - name: Package FFI library
        run: |
          ASSET_NAME="libzvec_ffi-darwin-aarch64.tar.gz"
          tar -czf "$ASSET_NAME" -C ffi/build libzvec_ffi.dylib
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"

      - name: Upload FFI release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" "$ASSET_NAME" --clobber

  release-ext:
    needs: create-release
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php-version: ['8.4']

    name: Build & Release PHP Extension - ${{ matrix.php-version }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: phpize

      - name: Fetch zvec SDK
        run: ./fetch_zvec_sdk.sh "$ZVEC_VERSION"

      - name: Build PHP extension
        run: ./php-ext/build_ext.sh

      - name: Run tests
        env:
          ZVEC_EXT: ${{ github.workspace }}/php-ext/modules/zvec.so
        run: .github/scripts/run-tests.sh

      # zvec.so finds libzvec.so next to itself ($ORIGIN rpath).
      - name: Package extension
        run: |
          ASSET_NAME="zvec-php${{ matrix.php-version }}-ubuntu24-x86_64.tar.gz"
          tar -czf "$ASSET_NAME" -C php-ext/modules zvec.so libzvec.so
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" "$ASSET_NAME" --clobber

  checksums:
    needs: [release-ffi-linux, release-ffi-macos, release-ext]
    runs-on: ubuntu-24.04
    name: Generate checksums.sha256

    permissions:
      contents: write

    steps:
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          cd assets
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.tar.gz"
          ls -la

      - name: Generate checksums.sha256
        run: |
          cd assets
          count=$(ls *.tar.gz 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "ERROR: No release assets found to checksum"
            exit 1
          fi
          sha256sum *.tar.gz > checksums.sha256
          cat checksums.sha256

      - name: Upload checksums.sha256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            assets/checksums.sha256 \
            --clobber
